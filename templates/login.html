{% extends "base.html" %}

{% block title %}{{ _("Login") }} - {{ _("ReimbursementTracker") }}{% endblock %}

{% block content %}

  <div style="max-width: 400px; margin: 0 auto;">
    <div class="card text-center mb-lg">
      <div class="text-4xl mb-md">🔐</div>
      <h2 class="mb-md">{{ _("Welcome back") }}</h2>
      <p class="text-secondary">{{ _("Sign in to your account to manage your claims") }}</p>
    </div>

    <div class="card">
      <form method="POST" action="/login" class="grid gap-lg">
        <div class="form-group">
          <label for="username">{{ _("Username") }}</label>
          <input type="text" id="username" name="username" required placeholder="{{ _('Enter your username') }}" autofocus />
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
          {{ _("Sign in") }} →
        </button>
      </form>

      <div class="mt-lg text-center text-sm">
        <p class="text-secondary">{{ _("Don't have an account?") }}</p>
        <a href="/signup" class="font-semibold">{{ _("Create one now") }}</a>
      </div>
    </div>
  </div>

{% endblock %}
