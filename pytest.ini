[pytest]
# Pytest configuration file

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests for individual functions
    integration: Integration tests for API endpoints
    regression: Regression tests to catch breaking changes
    slow: Slow tests that should be skipped by default
    ocr: OCR-related tests
    cloudinary: Cloudinary-related tests
    production: Production-only tests

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings

# Test paths
testpaths = tests

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout (optional, requires pytest-timeout)
# timeout = 300

# Coverage (optional, requires pytest-cov)
# --cov=. --cov-report=html --cov-report=term-missing
